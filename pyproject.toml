[project]
name = "careermatchai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fatimazahra-max", email = "fatimazahraelkassimi6@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.6.3",
